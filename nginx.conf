# Template for the production image. The official nginx image runs envsubst on
# /etc/nginx/templates/*.template at start-up, so these variables come from env
# (defaults are set in the Dockerfile):
#   API_UPSTREAM     origin of the API gateway / load balancer, e.g. http://gateway:8080
#   NGINX_RESOLVER   DNS server nginx uses to resolve API_UPSTREAM (127.0.0.11 inside Docker)
#
# The SPA and the API share one origin, so the browser never makes a cross-origin
# request and no CORS configuration is needed on the backend.

resolver ${NGINX_RESOLVER} valid=10s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    location /api/ {
        # A variable makes nginx resolve the upstream per request, so this container
        # still starts when the backend is not up yet. With a variable proxy_pass keeps
        # the original request URI (/api/... is forwarded unchanged).
        set $api_upstream ${API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # STOMP over WebSocket (booking-service). Read timeout must exceed the heartbeat.
    location /ws-fcourt {
        set $ws_upstream ${API_UPSTREAM};
        proxy_pass $ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
